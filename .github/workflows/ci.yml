name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_MODE: mock
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  commit-policy:
    name: Commit policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Test the commit message checker
        run: scripts/commit-msg-check.test.sh
      - name: Check every pushed commit (Conventional Commits, no AI attribution)
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-commit-range.sh

  verify:
    name: Lint, typecheck and test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:8.8.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # Tests create the roles and a fresh app_test database themselves (packages/db/src/testing.ts).
      DATABASE_SUPERUSER_URL: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_MIGRATOR_URL: postgres://app_migrator:app_migrator_ci@localhost:5432/app_test
      DATABASE_URL: postgres://app_user:app_user_ci@localhost:5432/app_test
      DATABASE_PLATFORM_URL: postgres://app_platform:app_platform_ci@localhost:5432/app_test
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:int

  e2e:
    name: End-to-end (Playwright, 1440 and 390 px)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:8.8.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_SUPERUSER_URL: postgres://postgres:postgres@localhost:5432/app
      DATABASE_MIGRATOR_URL: postgres://app_migrator:app_migrator_ci@localhost:5432/app
      DATABASE_URL: postgres://app_user:app_user_ci@localhost:5432/app
      DATABASE_PLATFORM_URL: postgres://app_platform:app_platform_ci@localhost:5432/app
      REDIS_URL: redis://localhost:6379/0
      PUBLIC_APP_URL: http://localhost:3000
      API_INTERNAL_URL: http://localhost:4000
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-0000000000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Database roles, migrations and demo seed
        run: pnpm db:provision && pnpm --filter @app/api build && pnpm --filter @app/api run seed
      - run: pnpm --filter @app/web build
      - name: Install Chromium
        run: pnpm --filter @app/web exec playwright install --with-deps chromium
      - run: pnpm --filter @app/web run e2e
      - name: Keep traces and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright
          path: |
            apps/web/e2e/.results
            apps/web/e2e/screenshots
          retention-days: 7

  images:
    name: Image (${{ matrix.app }}, arm64)
    # Native arm64 runner: the EC2 target is ARM, and emulated builds are slow.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            dockerfile: docker/service.Dockerfile
          - app: worker
            dockerfile: docker/service.Dockerfile
          - app: simulator
            dockerfile: docker/service.Dockerfile
          - app: web
            dockerfile: docker/web.Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (not pushed; pushing to ECR arrives with deploy in phase 9)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: APP=${{ matrix.app }}
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
