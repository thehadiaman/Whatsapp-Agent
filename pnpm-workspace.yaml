packages:
  - apps/*
  - packages/*
  - evals
  - load

# Supply-chain guard: refuse versions published less than two days ago, so a
# compromised release has time to be caught and yanked before we install it.
minimumReleaseAge: 2880

# Dependencies allowed to run install scripts (native binaries for SWC and esbuild).
allowBuilds:
  '@swc/core': true
  esbuild: true
  # Optional native speed-up for msgpackr (via BullMQ); the pure-JS fallback is fine.
  msgpackr-extract: false

# pdfjs-dist renders pages with this native canvas binary (35 MB); we only
# extract text, which works without it.
ignoredOptionalDependencies:
  - '@napi-rs/canvas'
